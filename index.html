<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hakoniwa</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #111;
        color: #ccc;
        font-family: monospace;
      }
      body {
        display: flex;
        align-items: safe center;
        justify-content: safe center;
        overflow: auto;
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #hud {
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #speed-control {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #333;
      }
      #dashboard {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .hist-card {
        background: #181818;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 4px;
      }
      .hist-card canvas {
        image-rendering: auto;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <span id="hud-tick">tick: 0</span>
        <span id="hud-dirty">dirty: 0 / 0</span>
        <span id="hud-epoch">epoch: 0</span>
        <span id="hud-pop">herbivores: 0</span>
        <button id="btn-pause">pause</button>
        <span id="speed-control">
          <button id="btn-speed-down">-</button>
          <span id="hud-speed">1.0x</span>
          <button id="btn-speed-up">+</button>
        </span>
      </div>
      <canvas id="board"></canvas>
      <div id="dashboard">
        <div class="hist-card"><canvas id="hist-grass"></canvas></div>
        <div class="hist-card"><canvas id="hist-hunger"></canvas></div>
        <div class="hist-card"><canvas id="hist-age"></canvas></div>
        <div class="hist-card"><canvas id="chart-totals"></canvas></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
